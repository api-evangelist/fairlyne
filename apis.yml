aid: fairlyne
name: Fairlyne
description: >-
  Fairlyne is a French travel-technology company offering a white-label
  Resale-as-a-Service platform that lets travel brands turn no-shows and
  low-yield bookings into new revenue by allowing passengers and guests to
  resell non-refundable tickets and reservations. Founded in 2021 by former
  Accor executives Gilles de Richemond and Michael d'Eboli, the platform
  serves airlines, railway and road-transport operators, and hospitality
  chains, and powers programs such as SNCF Ouigo's resale experience. Fairlyne
  raised a 3M EUR seed round from Speedinvest, Kima Ventures, Evolem, and FJ
  Labs. This repository captures any APIs, developer tools, and
  machine-readable API artifacts associated with Fairlyne. No public developer
  API or documentation portal has been identified at this time.
